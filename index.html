<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Dancing+Script:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Reddit+Sans+Condensed:wght@200..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    
  
  <h1 id="header">Expense Tracker</h1>
  
   <!-- Top card: home currency, total and status -->
    <section>
      <label for="homeCurrency">Home currency: </label>
      <select id="homeCurrency" name="homeCurrency" required></select>

      <p class="total">Total <span id="totalAmount" class="total-amount">0.00</span></p>

    
      <p class="status" id="status" role="status"></p>
    </section>

  <section class="card">
    <h2>Add expense</h2>
      <form id="expenseForm">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" placeholder="e.g., Lunch" required />
       <div class="form-row">
          <div>
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal" required />
          </div>

          <div>
            <label for="expenseCurrency">Currency</label>
            <select id="expenseCurrency" name="expenseCurrency"></select>
          </div>
        </div>
      
         <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="food">Food &amp; Dining</option>
          <option value="transport">Transport</option>
          <option value="utilities">Bills &amp; Utilities</option>
          <option value="shopping">Shopping</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
        </select>
         <button type="submit">Add Expense</button>
      </form>
  </section>

  <!--Expense Category with filter-->
  <section class="card">
    <div class="filter">
      <label for="categoryFilter">Filter by Category:</label>
      <select id="categoryFilter">
          <option value="" selected> All Categories</option>
          <option value="food">Food &amp; Dining</option>
          <option value="transport">Transport</option>
          <option value="utilities">Bills &amp; Utilities</option>
          <option value="shopping">Shopping</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
      </select>
    </div>

    <ul class="expense-list" id="expenseList"></ul>

  </section>
  
   <footer>
      <a href="https://www.exchangerate-api.com">Rates By Exchange Rate API</a>
    </footer>  

  <script type="module" src="src/main.js" ></script>
</body>
</html>
